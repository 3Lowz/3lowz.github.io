<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3Lowz — Senior Software Engineer</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
<style>
  html { scroll-behavior: smooth; }
  .app-main {
    margin-left: var(--sidebar-w);
    min-height: 100vh;
  }
  .placeholder {
    padding: var(--space-10) var(--space-9);
    max-width: 62rem;
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .placeholder .big {
    font-family: var(--font-display); font-weight: 700;
    font-size: var(--text-2xl); color: var(--text-primary); margin: var(--space-3) 0 var(--space-2);
  }
  .placeholder .sub {
    font-family: var(--font-mono); font-size: var(--text-sm); color: var(--text-muted); letter-spacing: 0.04em;
  }
  .sec-divider { height: 1px; background: var(--border-subtle); margin: 0 var(--space-9); }
  @media (max-width: 860px) {
    .app-main { margin-left: 0; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="./data.js"></script>
  <script type="text/babel" src="./SideNav.jsx"></script>
  <script type="text/babel" src="./Hero.jsx"></script>
  <script type="text/babel" src="./Skills.jsx"></script>
  <script type="text/babel" src="./Experience.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function Placeholder({ id, title }) {
      return (
        <section id={id} className="placeholder">
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.7rem', letterSpacing: '0.22em', textTransform: 'uppercase', color: 'var(--accent)' }}>{id}</div>
          <div className="big">{title}</div>
          <div className="sub">// to be done… soon</div>
        </section>
      );
    }

    function App() {
      const [active, setActive] = useState('about');
      const ids = ['about', 'skills', 'experience', 'blog', 'showcase'];

      useEffect(() => {
        const obs = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
        }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });
        ids.forEach((id) => { const el = document.getElementById(id); if (el) obs.observe(el); });
        return () => obs.disconnect();
      }, []);

      const navigate = (id) => {
        setActive(id);
        const el = document.getElementById(id);
        if (el) window.scrollTo({ top: el.offsetTop, behavior: 'smooth' });
      };

      return (
        <React.Fragment>
          <SideNav active={active} onNavigate={navigate} />
          <main className="app-main">
            <Hero />
            <div className="sec-divider" />
            <Skills />
            <div className="sec-divider" />
            <Experience />
            <div className="sec-divider" />
            <Placeholder id="blog" title="Blog" />
            <div className="sec-divider" />
            <Placeholder id="showcase" title="Showcase" />
          </main>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
