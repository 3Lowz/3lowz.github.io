<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
<style>
  body { margin: 0; padding: 26px; background: var(--bg-base); }
  .grid { display: grid; gap: 22px; }
  .block { display: flex; flex-direction: column; gap: 12px; }
  .lab { font-family: var(--font-mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-faint); }
  .rowx { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, IconButton, Tag, Badge, Avatar, Card, Eyebrow } = window.Ds3LowzDesignSystem_742f16;
    const di = (c) => <i className={c} />;

    function Demo() {
      return (
        <div className="grid">
          <div className="block">
            <div className="lab">Buttons</div>
            <div className="rowx">
              <Button variant="primary" icon={di('bi bi-download')}>Resume</Button>
              <Button variant="secondary">Contact</Button>
              <Button variant="ghost">Skip</Button>
              <Button variant="primary" size="sm">Small</Button>
              <Button variant="primary" disabled>Disabled</Button>
            </div>
          </div>

          <div className="block">
            <div className="lab">Icon buttons · Tags</div>
            <div className="rowx">
              <IconButton icon={di('bi bi-github')} label="GitHub" variant="outline" shape="circle" />
              <IconButton icon={di('bi bi-linkedin')} label="LinkedIn" variant="ghost" />
              <IconButton icon={di('bi bi-arrow-up-right')} label="Open" variant="solid" />
              <span style={{ width: 14 }} />
              <Tag icon={di('devicon-typescript-plain colored')}>TypeScript</Tag>
              <Tag icon={di('devicon-rust-original colored')}>Rust</Tag>
              <Tag tone="accent">React</Tag>
              <Tag tone="outline" size="sm">Redis</Tag>
            </div>
          </div>

          <div className="block">
            <div className="lab">Badges</div>
            <div className="rowx">
              <Badge tone="success" dot>Available for work</Badge>
              <Badge tone="accent">Freelance</Badge>
              <Badge>Remote</Badge>
              <Badge tone="warning" dot>Limited</Badge>
            </div>
          </div>

          <div className="rowx" style={{ alignItems: 'stretch', gap: 18 }}>
            <Card variant="glow" interactive style={{ flex: 1, minWidth: 260 }}>
              <Eyebrow index="01">Experience</Eyebrow>
              <h3 style={{ fontFamily: 'var(--font-display)', fontSize: 20, margin: '10px 0 6px', color: 'var(--text-primary)' }}>Extark Srl — Udine</h3>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--text-muted)' }}>Aug '24 — current · Software Engineer</div>
            </Card>
            <Card variant="glass" style={{ display: 'flex', gap: 14, alignItems: 'center' }}>
              <Avatar src="../../assets/portrait.jpg" size={64} status="online" />
              <div>
                <div style={{ fontFamily: 'var(--font-display)', fontWeight: 600, color: 'var(--text-primary)' }}>3Lowz</div>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--text-muted)' }}>Senior Engineer</div>
              </div>
            </Card>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
